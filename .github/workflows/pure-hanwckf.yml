name: pure-hanwckf-360t7

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      clean:
        description: '忽略旧 ccache 缓存，用空缓存重新编译（构建完仍会保存新缓存）'
        required: false
        default: false
        type: boolean

# 默认的 GITHUB_TOKEN 是只读的：发布 release、清理旧 release、删除旧运行都需要显式授权
permissions:
  contents: write   # 创建/删除 release 与 tag
  actions: write    # 删除旧的工作流运行

# 同一分支只允许一个构建在跑，避免两个运行抢同一个 release
concurrency:
  group: pure-hanwckf-360t7
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/hanwckf/immortalwrt-mt798x
  REPO_BRANCH: openwrt-21.02
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: pure.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  RELEASE_PREFIX: 360T7-hanwckf-ImmortalWrt
  # 整个仓库共保留的 release 数（含另一个工作流发布的固件），按你的设计刻意如此
  KEEP_RELEASES: 10
  KEEP_RUNS: 3
  # 编译缓存：workflow_dispatch 勾 clean=true 或 repository_dispatch 传 clean=true 时跳过恢复，
  # 用空缓存重编（这次构建仍会保存新缓存，下一次就能命中）
  CLEAN_CCACHE: ${{ inputs.clean || github.event.client_payload.clean || false }}
  CCACHE_DIR: /workdir/openwrt/.ccache
  CCACHE_MAXSIZE: 3G
  CCACHE_COMPRESS: '1'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
    - name: 检查项目分支
      uses: actions/checkout@v7.0.1

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -euo pipefail
        # 只删 runner 预装的第三方源（*.list），保留 ubuntu 自身的 sources，
        # 这样以后把 runs-on 换成 ubuntu-24.04 也不会把 apt 弄坏
        sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -name '*.list' -delete
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        # 21.02 编译完整依赖：bison/flex（内核 scripts/dtc）、libssl-dev、libelf-dev、
        # rsync、swig、device-tree-compiler、zstd 等缺一不可
        sudo -E apt-get -qq install \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext \
          gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
          lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
          libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build \
          p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
          python3-pyelftools python3-distutils qemu-utils re2c rsync scons squashfs-tools \
          subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown "$USER:$GROUPS" /workdir
        echo "FIRMWARE_VERSION=$(date +"%y%m%d")" >> "$GITHUB_ENV"
        df -hT "$GITHUB_WORKSPACE"

    - name: 下载源码
      working-directory: /workdir
      run: |
        set -euo pipefail
        df -hT "$PWD"
        git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt
        ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
        git -C openwrt log -1 --pretty='源码版本：%h %s'

    - name: 恢复 ccache 编译缓存
      id: ccache
      # 勾选 clean 时跳过恢复，本次用空缓存重编；本次编译后仍会保存新的缓存供后续使用
      if: env.CLEAN_CCACHE != 'true'
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-360t7-2102-${{ runner.os }}-${{ hashFiles('pure.config') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ccache-360t7-2102-${{ runner.os }}-${{ hashFiles('pure.config') }}-
          ccache-360t7-2102-${{ runner.os }}-

    - name: 恢复 dl 下载缓存
      id: dl
      # 用内容稳定的 key：命中就不重复上传（actions/cache 命中后不会再写一份，省流量省时间）；
      # 只有 pure.config 变了才会写新 key。注意它的 post 保存是 if: success()，
      # 所以本次运行失败时不会保存 —— 这是 action 自己的行为，不影响下次命中旧缓存。
      uses: actions/cache@v5
      with:
        path: /workdir/openwrt/dl
        key: dl-360t7-2102-${{ hashFiles('pure.config') }}
        restore-keys: |
          dl-360t7-2102-

    - name: 缓存状态
      shell: bash
      env:
        CCACHE_HIT: ${{ steps.ccache.outputs.cache-hit }}
        CCACHE_KEY: ${{ steps.ccache.outputs.cache-matched-key }}
        DL_HIT: ${{ steps.dl.outputs.cache-hit }}
      run: |
        set -uo pipefail
        # restore@v5 有 cache-matched-key；合并版 cache@v5 只有 cache-hit，别混用
        echo "ccache 恢复：${CCACHE_HIT:-skipped}（跳过=勾了 clean 或该步未执行）"
        echo "ccache 命中 key：${CCACHE_KEY:-无（本次冷编译）}"
        echo "dl 恢复：${DL_HIT:-false}"
        du -sh "$CCACHE_DIR" openwrt/dl 2>/dev/null || true

    - name: 加载软件源
      run: |
        set -euo pipefail
        # 仓库默认不带 feeds.conf.default；只有自己提供了才覆盖上游的
        if [ -e "$FEEDS_CONF" ]; then
          echo "使用仓库自带的 $FEEDS_CONF"
          mv "$FEEDS_CONF" openwrt/feeds.conf.default
        fi
        chmod +x "$DIY_P1_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    - name: 更新软件源
      run: |
        set -euo pipefail
        cd openwrt
        ./scripts/feeds update -a

    - name: 安装软件源
      run: |
        set -euo pipefail
        cd openwrt
        ./scripts/feeds install -a

    - name: 禁用冲突插件（避免依赖错误）
      run: |
        set -euo pipefail
        cd openwrt
        echo "🔧 彻底删除冲突插件，保留 openclash..."
        # scripts/feeds 生成的 package/feeds/<feed>/<pkg> 是符号链接，必须同时匹配链接
        for pkg in dns2socks-rust luci-app-fchomo luci-app-homeproxy momo nikki luci-app-passwall2; do
          if [ -e "package/feeds/small/$pkg" ] || [ -L "package/feeds/small/$pkg" ]; then
            echo "  🗑️  删除: $pkg"
          fi
          find package/feeds -maxdepth 3 -name "$pkg" \( -type d -o -type l \) -exec rm -rf {} + 2>/dev/null || true
        done
        echo "✅ 冲突插件清理完成"

    - name: 加载自定义配置
      run: |
        set -euo pipefail
        if [ -d files ]; then
          mv files openwrt/files
        fi
        if [ ! -s "$CONFIG_FILE" ]; then
          echo "::error::缺少配置文件 $CONFIG_FILE"
          exit 1
        fi
        mv "$CONFIG_FILE" openwrt/.config
        chmod +x "$DIY_P2_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P2_SH"

    - name: 接入官方最新发布版 OpenClash
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        cd openwrt
        python3 - <<'PYTHON'
        import json
        import os
        from pathlib import Path
        import re
        import shutil
        import subprocess
        import tempfile
        from urllib.request import Request, urlopen

        root = Path.cwd()
        if not (root / 'scripts/feeds').is_file():
            raise SystemExit('请在 OpenWrt 源码根目录运行')
        headers = {'Accept': 'application/vnd.github+json', 'User-Agent': 'OpenClash-firmware-build'}
        token = os.environ.get('GH_TOKEN')
        if token:
            headers['Authorization'] = 'Bearer ' + token
        request = Request('https://api.github.com/repos/vernesong/OpenClash/releases/latest', headers=headers)
        with urlopen(request, timeout=60) as response:
            release = json.load(response)
        tag = release.get('tag_name', '')
        if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag) or release.get('draft') or release.get('prerelease'):
            raise SystemExit('无法识别官方 latest release，停止构建，不回退旧版')
        print('官方最新发布版：' + tag, flush=True)
        work = Path(tempfile.mkdtemp(prefix='official-openclash-', dir=os.environ.get('RUNNER_TEMP')))
        checkout = work / 'upstream'
        subprocess.run(['git', 'clone', '--depth', '1', '--branch', tag, '--',
                        'https://github.com/vernesong/OpenClash.git', str(checkout)], check=True)
        package = checkout / 'luci-app-openclash'
        makefile = (package / 'Makefile').read_text()
        match = re.search(r'^PKG_VERSION\s*:?=\s*(\S+)\s*$', makefile, re.M)
        if not match or match[1] != tag[1:]:
            raise SystemExit('官方 tag 与包版本不匹配，停止构建')
        version = match[1]
        commit = subprocess.check_output(['git', '-C', str(checkout), 'rev-parse', 'HEAD'], text=True).strip()
        # Download and verify the official source before moving existing package definitions.
        # Backups stay outside OpenWrt, so its package scanner cannot select them.
        old = []
        for base in ('package', 'feeds'):
            for current, dirs, files in os.walk(root / base, followlinks=False):
                for name in list(dirs):
                    if name == 'luci-app-openclash':
                        old.append(Path(current) / name)
                        dirs.remove(name)
        backup = work / 'old-packages'
        backup.mkdir()
        for i, path in enumerate(old):
            print('移出旧 OpenClash 定义：' + str(path.relative_to(root)), flush=True)
            shutil.move(str(path), str(backup / str(i)))
        destination = root / 'package/luci-app-openclash'
        shutil.copytree(package, destination)
        # Also detect alternate directory names containing a duplicate package declaration.
        definitions = []
        for current, dirs, files in os.walk(root / 'package', followlinks=True):
            dirs[:] = [d for d in dirs if d not in ('.git', 'node_modules')]
            if 'Makefile' in files:
                path = Path(current) / 'Makefile'
                text = path.read_text(errors='replace')
                if re.search(r'^\s*(?:PKG_NAME\s*:?=\s*luci-app-openclash\s*$|define\s+Package/luci-app-openclash\s*$)', text, re.M):
                    definitions.append(path)
        if definitions != [destination / 'Makefile']:
            raise SystemExit('OpenClash 包定义不唯一：' + repr([str(p) for p in definitions]))
        record = f'OpenClash tag: {tag}\nPackage version: {version}\nSource commit: {commit}\n'
        print(record, flush=True)
        workspace = Path(os.environ.get('GITHUB_WORKSPACE', root.parent))
        (workspace / 'openclash-source.txt').write_text(record)
        if os.environ.get('GITHUB_ENV'):
            with open(os.environ['GITHUB_ENV'], 'a') as envfile:
                envfile.write(f'OPENCLASH_VERSION={version}\nOPENCLASH_TAG={tag}\n')
        PYTHON

    - name: 移出 Clashoo 包定义及语言包
      shell: bash
      run: |
        set -euo pipefail
        cd openwrt
        python3 - <<'PYTHON'
        import os
        from pathlib import Path
        import shutil
        import tempfile
        backup = Path(tempfile.mkdtemp(prefix="disabled-clashoo-", dir=os.environ["RUNNER_TEMP"]))
        candidates = []
        for base in ("package", "feeds"):
            for current, dirs, files in os.walk(base, followlinks=False):
                for name in list(dirs):
                    if name in ("clashoo", "luci-app-clashoo") or name.startswith("luci-i18n-clashoo-"):
                        candidates.append(Path(current) / name)
                        dirs.remove(name)
        for index, path in enumerate(candidates):
            print(f"移出不需要的 Clashoo 包定义：{path}", flush=True)
            shutil.move(str(path), str(backup / str(index)))
        PYTHON

    - name: 下载包
      id: package
      run: |
        set -euo pipefail
        cd openwrt
        # 放在 DIY 脚本之后，避免自定义脚本再次选中 Clashoo。
        python3 - <<'CONFIGEDIT'
        from pathlib import Path
        import re
        path = Path('.config')
        lines = path.read_text().splitlines()
        pattern = re.compile(r'^(?:# )?CONFIG_PACKAGE_(?:clashoo|luci-app-clashoo|luci-i18n-clashoo-[A-Za-z0-9_-]+|luci-app-openclash)(?:=| is not set)')
        lines = [line for line in lines if not pattern.match(line)]
        lines += ['# CONFIG_PACKAGE_clashoo is not set', '# CONFIG_PACKAGE_luci-app-clashoo is not set', '# CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn is not set', 'CONFIG_PACKAGE_luci-app-openclash=y']
        path.write_text('\n'.join(lines) + '\n')
        CONFIGEDIT
        make defconfig
        cp .config "$GITHUB_WORKSPACE/resolved.config"
        python3 - <<'PREFLIGHT'
        from pathlib import Path
        import os
        import re

        text = Path('.config').read_text()
        selected = dict(re.findall(r'^(CONFIG_[A-Za-z0-9_-]+)=([ym])$', text, re.M))
        required = [
         'TARGET_mediatek', 'TARGET_mediatek_mt7981',
         'TARGET_mediatek_mt7981_DEVICE_mt7981-360-t7-108M',
         'PACKAGE_luci-app-openclash', 'PACKAGE_luci-mod-system',
         'PACKAGE_firewall', 'PACKAGE_dnsmasq-full', 'PACKAGE_dnsmasq_full_ipset',
         'PACKAGE_ip-full', 'PACKAGE_bash', 'PACKAGE_curl', 'PACKAGE_ca-bundle',
         'PACKAGE_ruby', 'PACKAGE_ruby-yaml', 'PACKAGE_unzip', 'PACKAGE_ipset',
         'PACKAGE_iptables', 'PACKAGE_iptables-mod-tproxy', 'PACKAGE_iptables-mod-extra',
         'PACKAGE_kmod-ipt-nat', 'PACKAGE_kmod-tun', 'PACKAGE_kmod-inet-diag',
         'PACKAGE_kmod-mt_wifi', 'PACKAGE_kmod-conninfra', 'PACKAGE_luci-app-mtk',
         'PACKAGE_fstools', 'PACKAGE_mtd', 'PACKAGE_fwtool',
         'CCACHE',
        ]
        errors = []
        for symbol in required:
            if selected.get('CONFIG_' + symbol) != 'y':
                errors.append('缺少必要配置：CONFIG_' + symbol + '=y')
        for symbol in ['ALL', 'ALL_NONSHARED', 'ALL_KMODS', 'SDK', 'PACKAGE_dnsmasq', 'PACKAGE_ip-tiny', 'PACKAGE_firewall4']:
            if 'CONFIG_' + symbol in selected:
                errors.append('不应启用：CONFIG_' + symbol)
        for symbol in selected:
            if re.fullmatch(r'CONFIG_PACKAGE_(clashoo|luci-app-clashoo|luci-i18n-clashoo-.+|mihomo|nikki|momo|dae|daed|dns2socks-rust|luci-app-(nikki|momo|daede|fchomo|homeproxy|passwall2))', symbol):
                errors.append('存在不需要的额外代理包：' + symbol)
        # In addition to checking symbols, verify scanner input: no Clashoo package can be scanned.
        for current, dirs, files in os.walk('package', followlinks=True):
            dirs[:] = [name for name in dirs if name not in ('.git', 'node_modules')]
            if 'Makefile' in files:
                path = Path(current) / 'Makefile'
                data = path.read_text(errors='replace')
                if re.search(r'^\s*(?:PKG_NAME\s*:?=\s*(?:clashoo|luci-app-clashoo)\s*$|define\s+Package/(?:clashoo|luci-app-clashoo|luci-i18n-clashoo-[^/\s]+)\s*$)', data, re.M):
                    errors.append('仍能扫描到 Clashoo 包定义：' + str(path))
        metadata = Path('tmp/.packageinfo')
        if not metadata.is_file():
            errors.append('缺少 make defconfig 应生成的 tmp/.packageinfo，无法验证包扫描结果')
        else:
            for line in metadata.read_text(errors='replace').splitlines():
                if re.match(r'^Source-Makefile:.*(?:/clashoo/|/luci-app-clashoo/)', line):
                    errors.append('包元数据仍引用 Clashoo：' + line)
        report = '预检结果：' + ('失败' if errors else '通过') + '\n'
        report += '\n'.join(errors) + '\n'
        report += '已选择软件包：\n' + '\n'.join(sorted(k + '=' + v for k, v in selected.items() if k.startswith('CONFIG_PACKAGE_'))) + '\n'
        Path(os.environ['GITHUB_WORKSPACE'], 'preflight-report.txt').write_text(report)
        print(report, flush=True)
        if errors:
            raise SystemExit('编译前预检失败；不开始下载和编译，请查看 preflight-report.txt')
        PREFLIGHT
        if grep -Eq '^CONFIG_PACKAGE_(clashoo|luci-app-clashoo|luci-i18n-clashoo-[A-Za-z0-9_-]+)=[ym]$' .config; then
          echo "::error::Clashoo 或其语言包仍被选中，请检查对应包依赖"
          exit 1
        fi
        if ! grep -qx 'CONFIG_PACKAGE_luci-app-openclash=y' .config; then
          echo "::error::OpenClash 未选中，请检查包定义和依赖"
          exit 1
        fi
        # 网络抖动时降并发重试，避免个别包下载失败直接中止
        make download -j"$(nproc)" || make download -j8 || make download -j1
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      id: compile
      shell: bash
      run: |
        set -euo pipefail
        cd openwrt
        if make -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/build-parallel.log"; then
          echo "status=success" >> "$GITHUB_OUTPUT"
        elif make -j1 V=s 2>&1 | tee "$GITHUB_WORKSPACE/build-verbose.log"; then
          echo "status=success" >> "$GITHUB_OUTPUT"
        else
          echo "::error::固件编译失败，请下载编译诊断日志查看 build-verbose.log"
          exit 1
        fi

    - name: 输出 ccache 命中率
      if: always()
      shell: bash
      run: |
        set -uo pipefail
        { ccache -s; echo; echo "=== ccache 目录 ==="; du -sh "$CCACHE_DIR"; } \
          | tee "$GITHUB_WORKSPACE/ccache-stats.txt" || true
        { echo; ccache -p 2>/dev/null | grep -E '^(cache_dir|max_size|compression)' || true; } >> "$GITHUB_WORKSPACE/ccache-stats.txt"

    - name: 保存 ccache 编译缓存
      if: always()
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-360t7-2102-${{ runner.os }}-${{ hashFiles('pure.config') }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: 核对 OpenClash 安装包版本
      shell: bash
      run: |
        set -euo pipefail
        test -n "${OPENCLASH_VERSION:-}"
        mapfile -t packages < <(find openwrt/bin -type f -name "luci-app-openclash_${OPENCLASH_VERSION}*.ipk" -print)
        if (( ${#packages[@]} == 0 )); then
          echo "::error::未生成官方版本 OpenClash 安装包：$OPENCLASH_VERSION"
          exit 1
        fi
        printf '已生成：%s\n' "${packages[@]}"

    - name: 整理固件
      id: organize
      if: success() && steps.compile.outputs.status == 'success' && (env.UPLOAD_FIRMWARE == 'true' || env.UPLOAD_RELEASE == 'true')
      shell: bash
      run: |
        set -euo pipefail
        target_dir="$GITHUB_WORKSPACE/openwrt/bin/targets/mediatek/mt7981"
        output_dir="$GITHUB_WORKSPACE/firmware-output"
        if [[ ! -d "$target_dir" ]]; then
          echo "::error::未找到预期固件目录：$target_dir"
          exit 1
        fi
        find "$target_dir" -maxdepth 1 -type f -print
        shopt -s nullglob
        sysupgrade=("$target_dir"/*sysupgrade.bin "$target_dir"/*sysupgrade.itb "$target_dir"/*sysupgrade.tar)
        if (( ${#sysupgrade[@]} != 1 )); then
          echo "::error::预期仅生成一个 sysupgrade 镜像，实际找到 ${#sysupgrade[@]} 个。检查编译日志、设备选择及镜像文件名。"
          exit 1
        fi
        mkdir -p "$output_dir"
        cp "$GITHUB_WORKSPACE/openclash-source.txt" "$output_dir/"
        # 保留原始文件名和扩展名；不删除构建目录内任何诊断文件。
        cp -- "${sysupgrade[0]}" "$output_dir/"
        for image in "$target_dir"/*factory.bin "$target_dir"/*factory.ubi "$target_dir"/*factory.itb; do
          cp -- "$image" "$output_dir/"
        done
        # 随固件记录构建来源，便于事后追溯
        {
          echo "构建时间: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "运行链接: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "源码: ${REPO_URL} (${REPO_BRANCH}) $(git -C openwrt rev-parse --short HEAD)"
          echo "OpenClash: ${OPENCLASH_TAG} (${OPENCLASH_VERSION})"
          echo "配置摘要: $(sha256sum "$GITHUB_WORKSPACE/resolved.config" | cut -d' ' -f1)"
        } > "$output_dir/build-info.txt"
        (cd "$output_dir" && sha256sum -- * > SHA256SUMS)
        echo "FIRMWARE=$output_dir" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: 上传编译诊断日志
      uses: actions/upload-artifact@v7.0.2
      if: always()
      with:
        name: build-diagnostics-${{ github.run_id }}
        if-no-files-found: warn
        include-hidden-files: true
        path: |
          openclash-source.txt
          preflight-report.txt
          resolved.config
          openwrt/tmp/.packageinfo
          build-parallel.log
          build-verbose.log
          ccache-stats.txt
          openwrt/.config
          openwrt/bin/targets/mediatek/mt7981/*.buildinfo
          openwrt/bin/targets/mediatek/mt7981/profiles.json
          firmware-output/build-info.txt

    - name: 上传固件到Github Action空间
      uses: actions/upload-artifact@v7.0.2
      if: success() && steps.organize.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      with:
        name: ${{ env.FIRMWARE_VERSION }}-OpenWrt-360T7
        path: ${{ env.FIRMWARE }}

    - name: 创建release标签
      id: tag
      if: success() && steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      shell: bash
      run: |
        set -euo pipefail
        build_time="$(date '+%Y.%m.%d %H:%M:%S %Z')"
        # 同一天可以多次构建：tag 带时间与运行号，避免互相覆盖同一个 release
        release_tag="${RELEASE_PREFIX}-$(date +%Y%m%d-%H%M%S)-${GITHUB_RUN_ID}"
        release_name="${RELEASE_PREFIX}-$(date +%Y.%m.%d)"
        {
          echo "跟进上游变更"
          echo
          echo "- 默认网关：192.168.77.1"
          echo "- 登录密码：--"
          echo "- 设备：360 T7（108M UBI）"
          echo "- 源码：${REPO_URL}（${REPO_BRANCH}）"
          echo "- 内置 OpenClash：${OPENCLASH_TAG}"
          echo "- 构建时间：${build_time}"
          echo "- 构建日志：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        } > release.txt
        cat release.txt
        echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
        echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: 将固件上传到release
      uses: softprops/action-gh-release@v3.0.4
      if: success() && steps.organize.outputs.status == 'success' && steps.tag.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      env:
        # 注意：softprops/action-gh-release@v3 的 token 输入默认就是 ${{ github.token }}，
        # 这个 GITHUB_TOKEN 环境变量在 v3 里不再生效（v1/v2 才读它）。
        # 想以个人身份发布，请先修好 secrets.GIT_USER_TOKEN，再在 with 里显式加 token: ${{ secrets.GIT_USER_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GIT_USER_TOKEN }}
      with:
        name: ${{ steps.tag.outputs.release_name }}
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        fail_on_unmatched_files: true
        files: ${{ env.FIRMWARE }}/*

    - name: 删除旧的工作流运行
      if: always()
      # 收尾清理属于附加动作：失败只告警，不把已经成功的构建标红
      continue-on-error: true
      shell: bash
      env:
        # 只需要内置 token（permissions 已授予 actions: write），不依赖 PAT
        GH_TOKEN: ${{ github.token }}
      run: |
        set -uo pipefail
        workflow_file="$(basename "${GITHUB_WORKFLOW_REF%%@*}")"
        url="repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?per_page=100&status=completed"
        if ! ids="$(gh api "$url" --jq '.workflow_runs[].id')"; then
          echo "::warning::读取工作流运行列表失败，本次跳过清理"
          exit 0
        fi
        # 用 sed/awk 而不是 grep：grep 无匹配时返回 1，会被 pipefail 判成失败
        printf '%s\n' "$ids" | sed '/^$/d' | awk -v cur="${GITHUB_RUN_ID}" '$0 != cur' > runs.txt
        echo "已完成运行数：$(wc -l < runs.txt | tr -d ' ')，本次保留最新 ${KEEP_RUNS} 个"
        tail -n +"$((KEEP_RUNS + 1))" runs.txt | while read -r run_id; do
          echo "删除运行：${run_id}"
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
            || echo "::warning::删除运行 ${run_id} 失败"
        done

    - name: 删除旧的releases
      if: success() && steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      # 收尾清理属于附加动作：失败只告警，不把已经成功的构建标红
      continue-on-error: true
      shell: bash
      env:
        # 用内置 token（permissions 已授予 contents: write）：PAT 过期/未配置时这里不会 401
        GH_TOKEN: ${{ github.token }}
      run: |
        set -uo pipefail
        # 按你的设计：按仓库内 release 总数清理（含另一个工作流发布的固件），只保留最新 KEEP_RELEASES 个；
        # 故意不按 tag 前缀过滤，请勿修改。
        if ! tags="$(gh release list --limit 100 --json tagName,isDraft \
              --jq '.[] | select(.isDraft | not) | .tagName')"; then
          echo "::warning::读取 release 列表失败（token 无权限或 API 异常），本次跳过清理"
          exit 0
        fi
        printf '%s\n' "$tags" | awk 'NF' > releases.txt
        echo "当前 release 数：$(wc -l < releases.txt | tr -d ' ')，保留最新 ${KEEP_RELEASES} 个"
        tail -n +"$((KEEP_RELEASES + 1))" releases.txt | while read -r tag; do
          echo "删除旧 release：${tag}"
          gh release delete "$tag" --yes --cleanup-tag \
            || echo "::warning::删除 ${tag} 失败（可能受 tag 保护规则限制）"
        done
